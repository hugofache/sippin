name: Deploy PWA to TrueNAS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'        

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_POSTHOG_API_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_API_HOST }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANALYTICS_ID }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Known Hosts # Trust the server. Prevent "Are you sure?" prompt.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.PORT || '22' }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to TrueNAS
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PORT || '22' }}" \
            ./dist/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/mnt/tank/webapps/sippin/dist/
